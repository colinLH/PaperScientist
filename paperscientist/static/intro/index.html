<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172c36"><title>PaperScientist · 向未知出发</title>
  <link rel="stylesheet" href="/intro-assets/intro.css?v=7">
  <link rel="stylesheet" href="/intro-assets/immersive.css?v=2">
</head>
<body>
  <main id="journey" aria-label="PaperScientist 交互开场" data-scene="0">
    <div id="landscape" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>
    <div id="valley-mist" aria-hidden="true"><span></span><span></span></div>
    <canvas id="warp-canvas" aria-hidden="true" hidden></canvas>
    <div id="warp-controls" role="group" aria-label="穿梭速度" hidden><span>速度</span><button aria-pressed="false">1</button><button aria-pressed="false">2</button><button aria-pressed="true">3</button><button aria-pressed="false">4</button><button aria-pressed="false">5</button></div>
    <section id="work-scene" aria-label="研究作品展示" hidden>
      <svg class="work-grid" aria-hidden="true"></svg>
      <div class="work-portal"><div class="work-wall" aria-hidden="true"></div><div class="work-trail"></div></div>
      <div class="work-guidance"><p class="work-caption">滚动浏览论文项目 · 点击预览打开原站</p><div class="work-navigation"><div class="work-picker" role="group" aria-label="定位论文预览"></div><button type="button" class="work-playback" aria-pressed="true">暂停预览</button></div></div>
    </section>
    <header><a class="wordmark" href="/?workspace=1"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 30 16 16 30 2 16Zm0 7 7 7-7 7-7-7Z"/></svg>PaperScientist</a>
      <div class="header-actions"><button id="hand-toggle" type="button" aria-pressed="false">开启手势</button><button id="sound" type="button" aria-pressed="true">♫ <span>声音已开启</span></button><button id="credits-open" type="button" aria-label="音乐版权信息" title="音乐版权信息">ⓘ</button><a class="enter-link" href="/?workspace=1">跳过开场 ↗</a></div>
    </header>
    <div id="copy" aria-live="polite" aria-atomic="true">
      <p id="chapter">向未知出发</p><h1 id="title">每一个发现，<br>始于一个好问题。</h1>
      <p id="description">穿过已知的边界，让好奇心带路。</p>
      <a id="start" href="/?workspace=1" hidden><span>Start</span><small>开始我的研究</small><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></a>
    </div>
    <nav id="chapters" aria-label="开场章节"></nav>
    <aside id="hand-camera" aria-label="手势摄像头" hidden>
      <div class="camera-frame"><video muted playsinline aria-hidden="true"></video><canvas width="320" height="240" aria-label="摄像头画面及手部骨骼"></canvas><div class="camera-empty" aria-hidden="true">✧</div></div>
      <div class="camera-status"><span role="status">正在准备摄像头…</span><button type="button" data-retry>重试</button></div>
      <small>张开扩散 · 握拳聚拢 · 画面仅在本机处理</small>
    </aside>
    <footer><div class="chapter-count"><span id="number">01</span><span class="rule"></span><span>07</span><span id="scene-name">雾中的问题</span></div>
      <div class="scroll-control"><button id="previous" aria-label="上一幕" disabled>↑</button><span id="hint">滚动，向前探索</span><button id="next" aria-label="下一幕">↓</button></div>
    </footer>
    <p id="sound-status" class="sr-only" role="status"></p><p id="fallback" hidden>轻量场景模式 · 仍可滚动探索</p>
  </main>
  <dialog id="credits"><form method="dialog"><button aria-label="关闭版权信息">×</button></form><h2>配乐署名</h2>
    <p>场景配乐：<a href="https://www.scottbuckley.com.au/library/hiraeth/" target="_blank" rel="noopener">Hiraeth</a>、<a href="https://www.scottbuckley.com.au/library/solace/" target="_blank" rel="noopener">Solace</a>、<a href="https://www.scottbuckley.com.au/library/aurora/" target="_blank" rel="noopener">Aurora</a> — Scott Buckley。</p>
    <p>Released under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · <a href="https://www.scottbuckley.com.au" target="_blank" rel="noopener">www.scottbuckley.com.au</a>。原曲未裁剪；播放时调整音量与交叉淡化。</p>
  </dialog>
  <noscript><style>#copy{opacity:1}#start{display:flex!important}#landscape{background:linear-gradient(#596f7a,#192b39)}</style><p class="noscript">启用 JavaScript 可体验镜头漫游，或<a href="/?workspace=1">直接进入工作台</a>。</p></noscript>
  <script type="module" src="/intro-assets/intro.js?v=10"></script>
</body></html>
