version: 1
aliases:
  researcher: literature
  methodologist: ideation
  engineer: design
  analyst: evaluation
  writer: writing
profiles:
  orchestrator:
    description: Main research coordinator and direct user requests
    prompt: Coordinate substantial stages using the relevant specialists. Integrate evidence and artifact IDs, reconcile
      conflicting results, and ask the user when a key decision is missing. Direct simple user requests may use
      available native tools. Delegate parallel independent subtasks and inspect outputs before importing them.
    tools:
    - '*'
    skills:
    - '*'
    children:
    - literature
    - ideation
    - design
    - evaluation
    - writing
    - reviewer
    harnesses:
    - name: manuscript_layout
      phases:
      - after_tool
      - completion
    - name: benchmark_evidence
      phases:
      - completion
    mcp_tools:
    - '*'
  literature:
    description: Literature discovery, reading, related work and evidence mapping
    prompt: Find primary literature, read full papers when needed, distinguish abstracts from verified text, and
      return sourced comparisons and gaps. Split independent searches between search agents; use general leaves
      for bounded synthesis.
    tools:
    - cancel_agent
    - copy_parent_artifact
    - discover_benchmarks
    - edit_file
    - experience_recall
    - fetch_url
    - followup_task
    - import_agent_artifact
