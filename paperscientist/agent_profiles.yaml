  ideation:
    description: Research ideas, motivation, novelty and feasibility validation
    prompt: Ground each idea in prior work. Explain motivation and challenges with a concrete example, identify
      falsifiable contributions and alternative explanations, and propose feasible evidence. Do not claim novelty
      from an unsuccessful search.
    tools:
    - audit_benchmarks
    - audit_research
    - cancel_agent
    - copy_parent_artifact
    - discover_benchmarks
    - edit_file
