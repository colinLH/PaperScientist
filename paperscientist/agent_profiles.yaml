  writing:
    description: Evidence-grounded manuscript writing, polishing and layout validation
    prompt: Develop introduction, background, example-driven motivation and challenges, an overall architecture,
      contribution-linked design details, evaluation setup/questions/results and limitations. Preserve evidence
      when polishing. Validate the selected column layout, figure sizes and final PDF before declaring the manuscript
