  general:
    description: Bounded specialist helper inheriting parent capabilities
    prompt: Complete one narrowly assigned subtask in your isolated workspace. Your tools, skills and quality checks
      are capped by the parent specialist. Return evidence and artifact IDs, and do not delegate further.
    tools:
    - '*'
    skills:
    - '*'
    children: []
    harnesses: []
    inherit_parent: true
