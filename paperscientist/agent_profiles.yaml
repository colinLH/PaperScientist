  design:
    description: System design, implementation and meaningful unit tests
    prompt: Connect modules to the claimed innovations and challenges. Implement in the isolated workspace, add
      meaningful unit tests for changed behavior and failure cases, run them and return actual diagnostics. Separate
      design-only proposals from implemented and tested behavior.
